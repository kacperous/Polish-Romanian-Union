<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#181020" />
    <title>Unia Polsko-Rumuńska</title>
    <link rel="icon" href="./assets/gnome.png" />
    <style>
      @font-face {
        font-family: 'Pixelify';
        src: url('./assets/fonts/PixelifySans.ttf') format('truetype');
        font-display: block;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #181020;
        overflow: hidden;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      #game {
        position: fixed;
        inset: 0;
      }
      canvas {
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
      #rotate {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 10;
        background: #181020;
        color: #ffe040;
        font-family: 'Pixelify', monospace;
        font-size: 26px;
        text-align: center;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 16px;
        padding: 24px;
      }
      #rotate span {
        font-size: 64px;
      }
      @media (orientation: portrait) and (pointer: coarse) {
        #rotate {
          display: flex;
        }
      }
      .preload {
        font-family: 'Pixelify';
        position: absolute;
        left: -1000px;
      }
    </style>
  </head>
  <body>
    <div class="preload">ąęłóśźżćń</div>
    <div id="game"></div>
    <div id="rotate"><span>📱↻</span><div id="rotate-text">Obróć telefon poziomo,<br />żeby grać!</div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
